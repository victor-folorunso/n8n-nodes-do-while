# Publishes the package to npm on every version tag push (e.g. v0.1.1)
# Uses npm Trusted Publishers (OIDC) — no NPM_TOKEN needed.
#
# Setup (one-time):
# 1. Go to npmjs.com -> your package -> Settings -> Trusted Publishers
# 2. Add a publisher:
#    - Publisher: GitHub Actions
#    - Repository owner: victor-folorunso
#    - Repository name: n8n-nodes-do-while
#    - Workflow name: publish.yml
#
# To release a new version:
# 1. Update version in package.json
# 2. git add . && git commit -m "release: v0.x.x"
# 3. git tag v0.x.x
# 4. git push && git push --tags
# GitHub Actions will handle the rest automatically.

name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
